# AgentKeepAwake 自定义 Agent 名单
# ---------------------------------------------------------------
# 每行一个：显示名 = 关键字1,关键字2,...
# - 默认：关键字是“进程名的一部分”，不区分大小写（子串匹配）
# - 关键字前加 = 表示精确匹配整个进程名（可省略 .exe）
#   例：Codex = =codex.exe 只命中 codex.exe，
#       不会命中后台服务 codex-windows-sandbox-service
# - 一个显示名可写多个关键字（逗号/分号/竖线分隔）
# - 最多 24 条；界面最多显示 8 个 chip（运行中的优先，超出显示 +N）
# - 以 # 或 ; 开头的行是注释；改完保存，重新打开本程序生效
#
# 内置名单（无需重复写，国内/国际版分开统计）：
#   Trae       = =trae.exe
#   Trae CN    = =trae cn.exe
#   WorkBuddy  = =workbuddy.exe
#   WorkBuddy AI = =workbuddyai.exe
#   Qoder      = =qoder.exe, =qoder launcher.exe
#   Qoder CN   = qoder cn
#   DeepSeek   = deepseek            (DeepSeek Harness)
#   ZCode      = =zcode.exe
#   OpenCode   = =opencode.exe
#   Hermes     = =hermes.exe
#   MiniMax    = =minimax code.exe
#   MiMo       = =xiaomi mimo.exe
#   妙手        = =妙手.exe, miaoshou
#   Cursor     = =cursor.exe
#   Windsurf   = windsurf
#   Claude     = =claude.exe         (Claude Code CLI)
#   Codex      = =codex.exe
#
# 下面是可直接启用的示例（去掉行首的 # 即可）：
# 豆包 = doubao
# Copilot = copilot
# Cline = cline
# Roo = roo
# Aider = aider
# Continue = continue
# Zed = zed
# Kiro = kiro
# MarsCode = marscode
